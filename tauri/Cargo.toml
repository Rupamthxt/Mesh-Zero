[package]
name = "mesh-zero-gui"
version = "0.1.0"
edition = "2021"
description = "User-friendly GUI dashboard wrapper for Mesh-Zero idle compute pool"
publish = false

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "1.5" }
